<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Full Page PDF Viewer</title>
    <style>
        /* Reset default margins and padding */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }

        /* Make the object take up the entire viewport */
        object {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <object data="myfile.pdf" type="application/pdf" width="100%" height="100%">
        <p>It seems your browser does not support PDF viewing. 
        You can <a href="myfile.pdf">download the PDF file</a> instead.</p>
    </object>
</body>
</html>
